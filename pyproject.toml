[project]
name = "pep-scraper"
version = "0.1.0"
description = "Scrape own PEP duty roster from P&I LOGA3 and export it as ICS"
readme = "README.md"
authors = [
    { name = "Wim Bonis", email = "wb@stylite.de" }
]
requires-python = ">=3.13"
dependencies = [
    "icalendar>=7.3.0",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
pep-scraper = "pep_scraper.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "black>=26.10.1",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pep_scraper --cov-report=term-missing --cov-fail-under=80"
markers = ["browser: needs Playwright chromium installed"]

[tool.isort]
profile = "black"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "S108"]

[tool.mypy]
strict = true
